services:
  postgres:
    image: postgres:16-alpine
    container_name: turniring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turniring}
      POSTGRES_USER: ${POSTGRES_USER:-turniring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turniring-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-turniring}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-turniring}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: "-1"
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:?APP_BOOTSTRAP_ADMIN_PASSWORD is required}
      APP_JWT_COOKIE_SECURE: "true"
      SPRING_JPA_SHOW_SQL: "false"
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: turniring-frontend
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  gateway:
    image: nginx:1.27-alpine
    container_name: turniring-gateway
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/secure.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs/tls.crt:/etc/nginx/certs/tls.crt:ro
      - ./deploy/certs/tls.key:/etc/nginx/certs/tls.key:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/ || wget -q --spider http://127.0.0.1/" ]
      interval: 60s
      timeout: 3s
      retries: 10
      start_period: 3s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
