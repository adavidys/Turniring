name: Deploy and Security Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table
          skip-policy-update: true
          skip-dirs: deploy/certs,frontend/.npm-cache,frontend/node_modules,build,frontend/dist

  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate CI app secrets
        run: |
          echo "APP_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "APP_BOOTSTRAP_ADMIN_PASSWORD=ci-admin-password" >> "$GITHUB_ENV"

      - name: Backend tests
        run: ./gradlew test --no-daemon

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependencies
        run: npm --prefix frontend ci --no-fund --no-audit

      - name: Frontend build
        run: npm --prefix frontend run build

      - name: Frontend dependency audit
        run: npm --prefix frontend audit --audit-level=high

  deploy-smoke-test:
    runs-on: ubuntu-latest
    needs:
      - repository-security
      - build-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate CI deploy secrets
        run: |
          echo "POSTGRES_PASSWORD=ci-db-password" >> "$GITHUB_ENV"
          echo "APP_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "APP_BOOTSTRAP_ADMIN_PASSWORD=ci-admin-password" >> "$GITHUB_ENV"

      - name: Generate TLS certs
        run: ./scripts/generate-tls-certs.sh localhost

      - name: Compose build
        run: docker compose build

      - name: Compose up
        run: docker compose up -d

      - name: Verify HTTPS endpoints
        run: |
          curl -k --fail --show-error --silent https://127.0.0.1/ >/dev/null
          curl -k --fail --show-error --silent https://127.0.0.1/api/public/home >/dev/null

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Compose down
        if: always()
        run: docker compose down --volumes --remove-orphans
